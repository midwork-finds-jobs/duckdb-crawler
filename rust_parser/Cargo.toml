[package]
name = "rust_parser"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
scraper = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
# JS parsing via tree-sitter (lighter than SWC, better error recovery)
tree-sitter = "0.24"
tree-sitter-javascript = "0.23"
# Parse JS object literals (unquoted keys, trailing commas) as JSON
json5 = "0.4"
# Decode HTML entities in script content (Pinia/Vue SSR)
htmlescape = "0.3"
# HTTP client for Rust-side crawling
reqwest = { version = "0.12", features = ["rustls-tls", "gzip", "brotli", "deflate", "blocking"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
futures = "0.3"
# Simple blocking HTTP client (no tokio dependencies)
ureq = "3"
url = "2.5"
# Robots.txt and sitemap parsing
texting_robots = "0.2"  # robots.txt parser
quick-xml = "0.37"      # XML sitemap parser
# Readability - extract article content from HTML
readability = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
